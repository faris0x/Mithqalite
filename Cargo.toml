[workspace]
members = ['mithqalite', 'mithqalite-base', 'mithqalite-bigint', 'mithqalite-float', 'mithqalite-nz', 'mithqalite-q', 'mithqalite-criterion-bench']
resolver = "2"

[workspace.metadata.dylint]
libraries = [{ path = "mithqalite-lints" }]

[workspace.package]
edition = "2024"
rust-version = "1.90.0"

[workspace.dependencies]
mithqalite-base = { version = "0.14.0", path = 'mithqalite-base', default-features = false }
mithqalite-nz = { version = "0.14.0", path = 'mithqalite-nz', default-features = false }
mithqalite-q = { version = "0.14.0", path = 'mithqalite-q', default-features = false }
mithqalite-float = { version = "0.14.0", path = 'mithqalite-float', default-features = false }

[profile.release]
lto = "fat"
strip = true
codegen-units = 1

[package]
name = "mithqalite-bigint"
version = "0.14.0"
authors = ["Steve Shi <shikangzhi@gmail.com>"]
rust-version.workspace = true
edition.workspace = true
license = "LGPL-3.0-only"
description = "A drop-in num-bigint replacement based on Mithqalite"
repository = "https://github.com/faris0x/Mithqalite"

[dependencies]
mithqalite-base = { version = "0.14.0", path = "../mithqalite-base", default-features = false }
mithqalite-nz = { version = "0.14.0", path = "../mithqalite-nz", default-features = false }

num-traits = { version = "0.2.19", default-features = false, features = ["i128"] }
num-integer = { version = "0.1.46", default-features = false, features = ["i128"] }
paste = "1.0.15"
num-bigint = { version = "0.4", default-features = false, optional = true }
arbitrary = { version = "1", optional = true, default-features = false }
quickcheck = { version = "1", optional = true, default-features = false }
rand = { version = "0.8", optional = true, default-features = false }
serde = { version = "1.0", optional = true, default-features = false }

[dev-dependencies]
num-bigint = "0.4"

[features]
default = ["std"]
std = ["mithqalite-base/std", "mithqalite-nz/std"]
arbitrary = ["dep:arbitrary"]
quickcheck = ["dep:quickcheck"]
rand = ["dep:rand"]
serde = ["dep:serde"]
